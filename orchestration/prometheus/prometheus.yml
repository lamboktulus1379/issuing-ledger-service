storage:
  tsdb:
    out_of_order_time_window: 30m

rule_files:
  - /etc/prometheus/rules.yml

otlp:
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - deployment.environment.name
    - container.name

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308
