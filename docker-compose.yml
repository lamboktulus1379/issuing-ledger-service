services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=project
      - GO_ENV=production
      - TZ=Asia/Jakarta
      - ENV=
    ports:
      - "10001:10001"
      - "8081:8081"
    depends_on:
      - db
    volumes:
      - "/etc/timezone:/etc/timezone:ro"
      - "/etc/localtime:/etc/localtime:ro"
  liquibase:
    build:
      context: .
      dockerfile: liquibase/Dockerfile
    depends_on:
      - db
  #    volumes:
  #      - ./liquibase/ticketing-system/sql:/liquibase/changelog
  db:
    image: mysql:8.0.23
    platform: linux/amd64
    volumes:
      - /var/data/mysql:/var/lib/mysql
      - /etc/mysql:/etc/mysql
      - ./mysql-files:/var/lib/mysql-files
    restart: always
    environment:
      MYSQL_DATABASE: 'project'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'project'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'MyPassword_123'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'MyPassword_123'
      ENV: 'stage'
    ports:
      - "3308:3306"
      
  mariadb:
    image: mariadb:10.11
    container_name: ledger_db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: ledger
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  # ==========================================
  # [I-02] OBSERVABILITY & CACHING STACK
  # ==========================================
  redis:
    image: redis:7.2-alpine
    container_name: ledger-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "your_redis_password"

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: ledger-prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./orchestration/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./orchestration/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--web.enable-otlp-receiver'
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ledger-grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - PROMETHEUS_ENDPOINT=http://prometheus:9090
    volumes:
      - ./orchestration/grafana/config/provisioning:/etc/grafana/provisioning:ro
      - ./orchestration/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  otelcollector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: ledger-otelcollector
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      - PROMETHEUS_ENDPOINT=http://prometheus:9090/api/v1/otlp
    volumes:
      - ./orchestration/otelcollector/config.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - prometheus

  # ==========================================
  # [I-04] DEBEZIUM (CHANGE DATA CAPTURE)
  # ==========================================
  debezium:
    image: quay.io/debezium/connect:2.5
    container_name: ledger-debezium
    ports:
      - "8083:8083" # Kafka Connect REST API
    environment:
      - BOOTSTRAP_SERVERS=kafka:9093 # MUST match your internal Docker Kafka listener port!
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    depends_on:
      - kafka # Change this if your Kafka service is named differently
      - mariadb # Change this if your SQL Server service is named differently
  
  kafka:
    image: apache/kafka-native
    ports:
      - "9092:9092"
    environment:
      # Configure listeners for both docker and host communication
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

      # Settings required for KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091

      # Listener to use for broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Required for a single node cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    container_name: typing-kafka-exporter
    command:
      - --kafka.server=kafka:9093
      - --web.listen-address=0.0.0.0:9308
    ports:
      - "9308:9308"
    depends_on:
      - kafka

networks:
  ipv4:
    driver: bridge
    enable_ipv6: false
  dual:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "192.168.2.0/24"
          gateway: "192.168.2.1"
        - subnet: "2001:db8:2::/64"
          gateway: "2001:db8:2::1"

# ==========================================
# VOLUMES
# ==========================================
volumes:
  mssqldata: null
  sonarqube_data:
  sonarqube_temp:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql:
  postgresql_data:
  redis_data:
  prometheus_data:
  grafana_data:
  .:
  logvolume01: {}
  mariadb_data: