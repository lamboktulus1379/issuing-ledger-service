services:
  liquibase:
    build:
      context: ../..
      dockerfile: liquibase/Dockerfile
    depends_on:
      - db
    #    volumes:
    #      - ../../liquibase/ticketing-system/sql:/liquibase/changelog
    networks:
      - ledger_network

  db:
    image: mysql:8.0.23
    platform: linux/amd64
    volumes:
      - /var/data/mysql:/var/lib/mysql
      - /etc/mysql:/etc/mysql
      - ../../mysql-files:/var/lib/mysql-files
    restart: always
    environment:
      MYSQL_DATABASE: 'project'
      # So you don't have to use root, but you can if you like
      MYSQL_USER: 'project'
      # You can use whatever password you like
      MYSQL_PASSWORD: 'MyPassword_123'
      # Password for root access
      MYSQL_ROOT_PASSWORD: 'MyPassword_123'
      ENV: 'stage'
    ports:
      - "3308:3306"
    networks:
      - ledger_network

  mariadb:
    image: mariadb:10.11
    container_name: ledger_db
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: ledger
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - ledger_network
    command: 
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW

  redis:
    image: redis:7.2-alpine
    container_name: ledger-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass "your_redis_password"
    networks:
      - ledger_network

networks:
  ledger_network:
    name: ledger_network

volumes:
  mariadb_data:
  redis_data: