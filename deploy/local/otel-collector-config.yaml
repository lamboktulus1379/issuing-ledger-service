receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  # The Go application sends OTLP/gRPC to localhost:4317 when running on the host.
  # Inside Docker, services should use otel-collector:4317 instead.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Prometheus scrapes this endpoint from the collector container.
  prometheus:
    endpoint: 0.0.0.0:8889

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]